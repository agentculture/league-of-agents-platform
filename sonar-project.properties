# SonarCloud project identity. Matches the project key registered on
# SonarCloud and used by the cicd skill's Sonar status queries
# (`agentculture_league-of-agents-platform`).
sonar.projectKey=agentculture_league-of-agents-platform
sonar.organization=agentculture

# Source layout — package lives at the top level (no src/ wrapper).
sonar.sources=league_site
sonar.tests=tests

# Coverage report produced in CI by `uv run pytest --cov-report=xml:coverage.xml`
# (see .github/workflows/tests.yml). Path is relative to the repo root.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Don't analyze noise.
sonar.exclusions=**/__pycache__/**,**/.venv/**,uv.lock,.claude/skills/**

# Block CI on a failing quality gate. The scanner polls SonarCloud and exits
# non-zero on a red gate (coverage regression, new bugs/vulnerabilities). Only
# takes effect when the SonarCloud Scan step runs — that step is guarded by
# `if: env.SONAR_TOKEN != ''` in .github/workflows/tests.yml, so token-less
# repos and fork PRs (no injected secret) skip the scan and stay green.
sonar.qualitygate.wait=true

# Evals export/scan CLI paths (PR #44). These tools read and write exactly the
# files the operator names on the command line (--bundle, --config, --thinking,
# --out) on the match host; there is no untrusted caller. The eval id and match
# tags that become path segments are held to a safe-name pattern in
# _check_config and re-checked at use by export._child, which Sonar's taint
# analysis does not recognise as a sanitiser.
sonar.issue.ignore.multicriteria=evals1,evals2,evals3
sonar.issue.ignore.multicriteria.evals1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.evals1.resourceKey=league_site/evals/export.py
sonar.issue.ignore.multicriteria.evals2.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.evals2.resourceKey=league_site/evals/export.py
sonar.issue.ignore.multicriteria.evals3.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.evals3.resourceKey=league_site/evals/scan.py
